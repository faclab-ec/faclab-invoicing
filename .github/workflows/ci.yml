name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The repository tests in test/postgres run against it (skipped without TEST_DATABASE_URL)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: faclab_invoicing
          POSTGRES_PASSWORD: faclab_invoicing
          POSTGRES_DB: faclab_invoicing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faclab_invoicing -d faclab_invoicing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://faclab_invoicing:faclab_invoicing@localhost:5432/faclab_invoicing_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # contracts/ is a copy of faclab-core's, pinned in contracts/source.json: it must match
      # faclab-core at that commit (update it with npm run contracts:sync)
      - name: Read the pinned faclab-core commit
        id: contracts
        run: echo "commit=$(jq -r .commit contracts/source.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: faclab-ec/faclab-api
          ref: ${{ steps.contracts.outputs.commit }}
          path: .faclab-core
          sparse-checkout: contracts
          persist-credentials: false

      - name: Contract copy matches faclab-core
        run: diff -r --exclude=source.json .faclab-core/contracts contracts

      # `npm test` runs them again; this step names the failure
      - name: Contract tests
        run: npm run test:contract

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Builds the production image without publishing it (that comes with S8.2)
  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --target production --build-arg SERVICE_VERSION=${{ github.sha }} -t faclab-invoicing:ci .

      - name: Refuse to start without settings
        run: |
          if docker run --rm -e OTEL_SDK_DISABLED=true faclab-invoicing:ci > startup.log 2>&1; then
            echo "The image started without KAFKA_BROKERS, DATABASE_URL and JWT_SECRET"
            exit 1
          fi
          cat startup.log
          grep -q 'JWT_SECRET is required' startup.log
          grep -q 'KAFKA_BROKERS is required' startup.log
          grep -q 'DATABASE_URL is required' startup.log
