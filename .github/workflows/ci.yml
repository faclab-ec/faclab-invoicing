name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The public API's contract (S6.3): docs/public-api/openapi-v1.json against the base branch's.
  # Removing or renaming a field, changing a type or making a field required fails here: that
  # needs /api/v2. That the file is the code's contract is checked by test/http/public-openapi
  public-api-compat:
    name: public-api-compat
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compare the public OpenAPI with the base branch's
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SPEC: docs/public-api/openapi-v1.json
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          if ! git show "$BASE:$SPEC" > "$RUNNER_TEMP/base/openapi-v1.json" 2>/dev/null; then
            echo "No public OpenAPI at $BASE yet: nothing to compare"
            exit 0
          fi
          docker run --rm \
            -v "$RUNNER_TEMP/base:/base:ro" \
            -v "$PWD/docs/public-api:/revision:ro" \
            tufin/oasdiff:v1.34.1@sha256:67a23cfea7d251e2ae34ee703ac8733c5d96bc2e7b90fd0f4d475ec99367b85f breaking \
            /base/openapi-v1.json /revision/openapi-v1.json \
            --fail-on ERR --format githubactions

  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The repository tests in test/postgres run against it (skipped without TEST_DATABASE_URL)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: faclab_invoicing
          POSTGRES_PASSWORD: faclab_invoicing
          POSTGRES_DB: faclab_invoicing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faclab_invoicing -d faclab_invoicing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://faclab_invoicing:faclab_invoicing@localhost:5432/faclab_invoicing_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # contracts/ is a copy of faclab-core's, pinned in contracts/source.json: it must match
      # faclab-core at that commit (update it with npm run contracts:sync)
      - name: Read the pinned faclab-core commit
        id: contracts
        run: echo "commit=$(jq -r .commit contracts/source.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: faclab-ec/faclab-api
          ref: ${{ steps.contracts.outputs.commit }}
          path: .faclab-core
          sparse-checkout: contracts
          persist-credentials: false

      - name: Contract copy matches faclab-core
        run: diff -r --exclude=source.json .faclab-core/contracts contracts

      # `npm test` runs them again; this step names the failure
      - name: Contract tests
        run: npm run test:contract

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Builds the production image without publishing it: a tag publishes it (release.yml, S8.2)
  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --target production --build-arg SERVICE_VERSION=${{ github.sha }} -t faclab-invoicing:ci .

      - name: Refuse to start without settings
        run: |
          if docker run --rm -e OTEL_SDK_DISABLED=true faclab-invoicing:ci > startup.log 2>&1; then
            echo "The image started without KAFKA_BROKERS, DATABASE_URL and JWT_JWKS_URL"
            exit 1
          fi
          cat startup.log
          grep -q 'JWT_JWKS_URL is required' startup.log
          grep -q 'KAFKA_BROKERS is required' startup.log
          grep -q 'DATABASE_URL is required' startup.log
