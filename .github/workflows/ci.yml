name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Builds the production image without publishing it (that comes with S8.2)
  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --target production -t faclab-invoicing:ci .

      - name: Refuse to start without settings
        run: |
          if docker run --rm -e OTEL_SDK_DISABLED=true faclab-invoicing:ci > startup.log 2>&1; then
            echo "The image started without SRI_ENVIRONMENT and KAFKA_BROKERS"
            exit 1
          fi
          cat startup.log
          grep -q 'SRI_ENVIRONMENT is required' startup.log
          grep -q 'KAFKA_BROKERS is required' startup.log
