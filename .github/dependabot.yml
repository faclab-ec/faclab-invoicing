version: 2
updates:
  # The workflows pin each action by commit SHA (S9.3): a monthly PR moves them all
  # to their latest release
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Only the security updates the repository's settings turn on: no version updates
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
